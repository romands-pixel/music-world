<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>MUSIC WORLD</title>
<style>
:root{--bg:#07070b;--p1:#0f0f17;--p2:#1a1a27;--ink:#f2f0fa;--mute:#9a97b0;--v:#8b5cf6;--r:#ef4444;--b:#3b82f6;--g:linear-gradient(120deg,var(--v),var(--r) 55%,var(--b))}
*{box-sizing:border-box}html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:grid;grid-template:"s m" 1fr "p p" auto/220px 1fr;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--v);outline-offset:2px}
nav{grid-area:s;background:var(--p1);padding:20px 12px;display:flex;flex-direction:column;gap:4px;border-right:1px solid #ffffff12}
.logo{font-weight:900;font-size:19px;letter-spacing:.04em;background:var(--g);-webkit-background-clip:text;background-clip:text;color:transparent;padding:0 12px 18px}
nav button{text-align:left;padding:11px 12px;border-radius:10px;color:var(--mute);font-weight:600;transition:.2s}
nav button:hover,nav button.on{color:var(--ink);background:var(--p2)}
main{grid-area:m;overflow-y:auto;padding:0 28px 28px}
.top{position:sticky;top:0;z-index:5;background:linear-gradient(var(--bg) 70%,transparent);padding:18px 0 14px}
.top input{width:100%;max-width:520px;padding:13px 18px;border-radius:999px;border:1px solid #ffffff1c;background:var(--p2);color:var(--ink);font:inherit}
h2{font-size:21px;margin:26px 0 12px}
.note{padding:14px 16px;border-radius:12px;background:#ef444422;border:1px solid #ef444455;margin:8px 0}
.note code{background:#0006;padding:1px 6px;border-radius:5px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:16px}
.card{background:var(--p1);border-radius:14px;padding:12px;text-align:left;transition:.25s}
.card:hover{background:var(--p2);transform:translateY(-3px)}
.card img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:10px;background:var(--p2)}
.card.ar img{border-radius:50%}
.card b,.card span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card b{margin-top:8px}.card span{color:var(--mute);font-size:13px}
.genres{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px}
.gn{height:80px;border-radius:12px;padding:12px;text-align:left;font-weight:800;transition:.25s}
.gn:hover{transform:scale(1.04)}
.tr{display:grid;grid-template-columns:44px 1fr auto auto auto;gap:10px;align-items:center;padding:7px 10px;border-radius:10px;cursor:pointer;animation:in .3s both}
.tr:hover{background:var(--p2)}.tr.on{background:#8b5cf630}
.tr img{width:44px;height:44px;border-radius:7px;object-fit:cover}
.m{overflow:hidden}.m b,.m span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.m span{color:var(--mute);font-size:13px}
.tr button{width:34px;height:34px;border-radius:50%;color:var(--mute)}.tr button:hover{color:var(--ink)}.tr button.on{color:var(--r)}
@keyframes in{from{opacity:0;transform:translateY(6px)}}
.hero{display:flex;gap:20px;align-items:flex-end;margin:12px 0}
.hero img{width:160px;height:160px;border-radius:14px;object-fit:cover}.hero h1{margin:0;font-size:32px}
.btn{padding:10px 18px;border-radius:999px;background:var(--g);font-weight:700}
.btn.alt{background:var(--p2)}
.row{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.row input{padding:10px 14px;border-radius:999px;border:1px solid #ffffff1c;background:var(--p2);color:var(--ink);font:inherit}
#pl{grid-area:p;background:var(--p1);border-top:1px solid #ffffff12;padding:10px 18px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.4fr) minmax(0,1fr);gap:16px;align-items:center}
.np{display:flex;gap:12px;align-items:center;min-width:0}.np img{width:52px;height:52px;border-radius:8px;object-fit:cover;background:var(--p2)}
.ctr{display:flex;flex-direction:column;gap:6px;align-items:center}
.bt{display:flex;gap:4px;align-items:center}
.bt button{width:38px;height:38px;border-radius:50%;color:var(--mute);font-size:17px}.bt button:hover{color:var(--ink)}.bt button.on{color:var(--v)}
.bt .pp{width:46px;height:46px;background:var(--g);color:#fff;font-size:18px}.bt .pp:hover{color:#fff;filter:brightness(1.15)}
.sk{display:flex;gap:8px;align-items:center;width:100%;font-size:12px;color:var(--mute)}
input[type=range]{flex:1;-webkit-appearance:none;appearance:none;height:5px;border-radius:3px;background:linear-gradient(to right,var(--v) var(--p,0%),#ffffff25 var(--p,0%))}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:13px;height:13px;border-radius:50%;background:#fff}
input[type=range]::-moz-range-thumb{width:13px;height:13px;border:0;border-radius:50%;background:#fff}
.vl{display:flex;gap:8px;justify-content:flex-end;align-items:center}.vl input{max-width:110px}
#menu{position:fixed;inset:0;background:#000a;display:none;place-items:center;z-index:20}
#menu.on{display:grid}#menu div{background:var(--p2);border-radius:16px;padding:16px;width:min(340px,90vw);max-height:70vh;overflow:auto}
#menu button{display:block;width:100%;text-align:left;padding:11px;border-radius:8px}#menu button:hover{background:#ffffff14}
#toast{position:fixed;left:50%;bottom:110px;transform:translateX(-50%);background:var(--p2);padding:10px 18px;border-radius:999px;opacity:0;transition:.3s;pointer-events:none;z-index:30}
#toast.on{opacity:1}
.empty{color:var(--mute);padding:10px 0}
@media(max-width:760px){
body{grid-template:"m" 1fr "p" auto "s" auto/1fr}
nav{flex-direction:row;padding:6px;border:0;border-top:1px solid #ffffff12;padding-bottom:max(6px,env(safe-area-inset-bottom))}
nav button{flex:1;text-align:center;padding:10px 2px;font-size:13px}.logo{display:none}
main{padding:0 14px 18px}
#pl{grid-template-columns:1fr auto;gap:8px;padding:8px 12px}.ctr{grid-column:1/-1;order:3}.vl{display:none}
.tr{grid-template-columns:44px 1fr auto auto}.tr button[data-a=q]{display:none}
.hero{flex-direction:column;align-items:flex-start}
}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
